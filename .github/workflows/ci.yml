# Runs formatting, vet, and the test suite (including Slint's conformance corpus)
# on every push to main and every pull request. Builds the native shim from source
# so the cgo packages link.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Fetch Slint source
        run: |
          ref="$(cat .slint-version)"
          git init -q slint
          git -C slint remote add origin https://github.com/slint-ui/slint
          git -C slint fetch --depth 1 origin "$ref"
          git -C slint checkout -q FETCH_HEAD

      - name: Install build deps
        # libgl-dev: the GL examples import go-gl, whose cgo needs `pkg-config gl`
        # to compile (headers only — no display needed; the tests never open GL).
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libgl-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/goslint-sys/target
          key: cargo-ci-${{ hashFiles('.slint-version', 'rust/goslint-sys/Cargo.toml') }}

      - name: Build native shim
        run: make lib

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # The android shim has a different dependency graph than the desktop one
  # (upstream target-gates its backends: winit is excluded, android-activity and
  # skia come in), so a desktop-green build proves nothing about it — and the
  # release workflow used to be the first thing that ever compiled it, after the
  # tag already existed. cargo check compiles the full android graph (catching
  # feature/cfg breakage like the v0.23.0 release failure) without LTO or
  # linking, so it's cheap enough to run on every push. `make check-android`
  # runs the same thing locally.
  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Slint source
        run: |
          ref="$(cat .slint-version)"
          git init -q slint
          git -C slint remote add origin https://github.com/slint-ui/slint
          git -C slint fetch --depth 1 origin "$ref"
          git -C slint checkout -q FETCH_HEAD

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add aarch64-linux-android

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/goslint-sys/target
          key: cargo-android-check-${{ hashFiles('.slint-version', 'rust/goslint-sys/Cargo.toml') }}

      - name: cargo check (aarch64-linux-android)
        run: make check-android
