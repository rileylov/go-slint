# Builds the native Slint shim (libgoslint) for every shippable target and
# publishes them — plus a manifest.json the `goslint setup` tool consumes — to a
# GitHub Release. Everything cross-compiles from a single Linux runner.
#
#   - tag push  vX.Y.Z  -> build all targets + publish the release
#   - manual run        -> build all targets only (no publish), to test the matrix
#
# Releasing: just push a vX.Y.Z tag. There's no version constant to bump — the CLI
# resolves the lib version dynamically (the user's go.mod, else this goslint's own
# install tag), so `goslint setup` fetches the release published at that tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      slint_ref:
        description: "Slint git ref to build against (default: .slint-version)"
        required: false
        default: ""

permissions:
  contents: write # create releases / upload assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets are built natively (arm64 on an arm64 runner) so the
          # fontconfig dev package installs without a cross-apt dance.
          - { target: linux_amd64, runner: ubuntu-latest, rust: x86_64-unknown-linux-gnu, kind: static, apt: libfontconfig-dev }
          - { target: linux_arm64, runner: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu, kind: static, apt: libfontconfig-dev }
          # macOS: BOTH built on macos-14 (Apple Silicon). darwin_amd64 cross-compiles to
          # x86_64-apple-darwin — the macOS SDK is universal and the static build only
          # archives objects (no link/exec of x86_64 code), so no scarce/slow Intel
          # (macos-13) runner is needed. Xcode CLT (the AppKit/Foundation frameworks the
          # system-tray appkit backend needs) is preinstalled, so no apt. The release
          # ships the static .a; the dylib/install_name_tool dance is only for `make lib`.
          - { target: darwin_arm64, runner: macos-14, rust: aarch64-apple-darwin, kind: static, apt: "" }
          - { target: darwin_amd64, runner: macos-14, rust: x86_64-apple-darwin, kind: static, apt: "" }
          # Windows + Android cross-compile from x86_64 (neither uses fontconfig).
          - { target: windows_amd64, runner: ubuntu-latest, rust: x86_64-pc-windows-gnu, kind: static, apt: gcc-mingw-w64-x86-64 }
          - { target: android_arm64, runner: ubuntu-latest, rust: aarch64-linux-android, kind: shared, apt: "" }
          - { target: android_amd64, runner: ubuntu-latest, rust: x86_64-linux-android, kind: shared, apt: "" }
          # iOS: static .a built on macos-14 (Xcode ships the iOS SDKs). Like darwin these
          # only archive objects, so cross-compiling to the device (aarch64-apple-ios) and
          # the Apple-Silicon simulator (aarch64-apple-ios-sim) needs no target link/exec.
          # `goslint ios build` downloads these; the frameworks come from native-static-libs.
          - { target: ios_arm64, runner: macos-14, rust: aarch64-apple-ios, kind: static, apt: "" }
          - { target: ios_sim_arm64, runner: macos-14, rust: aarch64-apple-ios-sim, kind: static, apt: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Slint ref
        id: slint
        run: |
          ref="${{ github.event.inputs.slint_ref }}"
          [ -z "$ref" ] && ref="$(cat .slint-version)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building against Slint $ref"

      - name: Fetch Slint source
        run: |
          git init -q slint
          git -C slint remote add origin https://github.com/slint-ui/slint
          git -C slint fetch --depth 1 origin "${{ steps.slint.outputs.ref }}"
          git -C slint checkout -q FETCH_HEAD

      - name: Install Rust + target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.rust }}

      - name: Install build deps
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/goslint-sys/target
          key: cargo-${{ matrix.target }}-${{ steps.slint.outputs.ref }}-${{ hashFiles('rust/goslint-sys/Cargo.toml') }}

      - name: Build static lib (desktop + iOS)
        if: matrix.kind == 'static'
        working-directory: rust/goslint-sys
        env:
          # Only used by the Windows cross build; ignored by native linux builds.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
        run: |
          # Build ONLY the staticlib (what desktop ships) — not the cdylib. Skipping the
          # cdylib speeds every desktop target and, crucially, avoids cross-LINKING a
          # cdylib for darwin_amd64 on the arm64 macos-14 runner (a staticlib just
          # archives objects, so cross-compiling needs no target link/exec).
          cargo rustc --release --target ${{ matrix.rust }} --crate-type staticlib
          libs="$(cargo rustc --release --target ${{ matrix.rust }} --crate-type staticlib -- \
                    --print native-static-libs 2>&1 | sed -n 's/.*native-static-libs: //p' | tail -1)"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          dest="$GITHUB_WORKSPACE/dist/libgoslint-${{ matrix.target }}.a"
          cp "target/${{ matrix.rust }}/release/libgoslint.a" "$dest"

          # Windows: the `windows` crate (via winit) needs umbrella import libs like
          # `-lwindows.0.52.0`, whose .a files ship inside the windows_*_gnu crate and
          # are NOT present on a user's machine. Merge them INTO libgoslint.a so the
          # shipped archive is self-contained, and drop the -lwindows.* tokens from the
          # published link line (their symbols now live in libgoslint.a).
          if [ "${{ matrix.target }}" = "windows_amd64" ]; then
            artool=x86_64-w64-mingw32-ar
            newlibs=""
            merge=""
            for tok in $libs; do
              case "$tok" in
                -lwindows.*)
                  name="lib${tok#-l}.a"
                  path="$(find "$HOME/.cargo/registry/src" "$PWD/target" -name "$name" 2>/dev/null | head -1)"
                  if [ -n "$path" ]; then
                    merge="$merge $path"
                  else
                    echo "WARN: $name not found; keeping $tok on the link line" >&2
                    newlibs="$newlibs $tok"
                  fi
                  ;;
                *) newlibs="$newlibs $tok" ;;
              esac
            done
            if [ -n "$merge" ]; then
              # Write the MRI script via echo so the ar commands have no leading space.
              { echo "OPEN $dest"; for p in $merge; do echo "ADDLIB $p"; done; echo "SAVE"; echo "END"; } > merge.mri
              cat merge.mri
              "$artool" -M < merge.mri
              echo "merged windows import libs:$merge"
            fi
            libs="$(echo "$newlibs" | xargs)"
          fi

          echo "LIBS=$libs" >> "$GITHUB_ENV"

      - name: Build shared lib (android)
        if: matrix.kind == 'shared'
        working-directory: rust/goslint-sys
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=24
          clang="$BIN/${{ matrix.rust }}$API-clang"
          ar="$BIN/llvm-ar"
          upper="$(echo ${{ matrix.rust }} | tr 'a-z-' 'A-Z_')"
          under="$(echo ${{ matrix.rust }} | tr '-' '_')"
          export "CARGO_TARGET_${upper}_LINKER=$clang" "CC_${under}=$clang" \
                 "CXX_${under}=${clang}++" "AR_${under}=$ar"
          cargo build --release --target ${{ matrix.rust }}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "target/${{ matrix.rust }}/release/libgoslint.so" \
             "$GITHUB_WORKSPACE/dist/libgoslint-${{ matrix.target }}.so"

      - name: Write target metadata
        working-directory: dist
        run: |
          file="$(ls libgoslint-${{ matrix.target }}.*)"
          # macOS runners have `shasum -a 256`, not GNU `sha256sum`.
          sha="$( (sha256sum "$file" 2>/dev/null || shasum -a 256 "$file") | cut -d' ' -f1)"
          cat > "meta-${{ matrix.target }}.json" <<EOF
          {"target":"${{ matrix.target }}","archive":"$file","sha256":"$sha","libs":"${LIBS:-}","kind":"${{ matrix.kind }}"}
          EOF
          cat "meta-${{ matrix.target }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so git-cliff can build the changelog

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Assemble manifest.json + SHA256SUMS
        working-directory: dist
        run: |
          slint_ref="$(cat "$GITHUB_WORKSPACE/.slint-version")"
          targets="$(jq -s 'map({(.target): {archive,sha256,libs,kind}}) | add' meta-*.json)"
          jq -n --arg v "$GITHUB_REF_NAME" --arg s "$slint_ref" --argjson t "$targets" \
             '{version:$v, slint:$s, targets:$t}' > manifest.json
          rm -f meta-*.json
          sha256sum libgoslint-* manifest.json > SHA256SUMS
          echo "=== manifest.json ==="; cat manifest.json

      # Group this tag's conventional commits (feat/fix/…) into "Added / Fixed /
      # …" sections. Writes the rendered notes to RELEASE_NOTES.md.
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      # Wrap the generated changes with the install snippet + build provenance.
      - name: Assemble release body
        run: |
          {
            echo '## Install'
            echo '```sh'
            echo 'go install github.com/rileylov/go-slint/cmd/goslint@${{ github.ref_name }}'
            echo '```'
            echo
            echo '## Changes'
            cat RELEASE_NOTES.md
            echo
            echo "Built against Slint \`$(cat .slint-version)\` (go-slint \`${{ github.sha }}\`)."
            echo
            echo 'You can find the prebuilt `libgoslint` native libraries for go-slint below.'
          } > release-body.md
          echo "=== release body ==="; cat release-body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/libgoslint-*
            dist/manifest.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: release-body.md
