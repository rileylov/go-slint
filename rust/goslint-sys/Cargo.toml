# Layer 0 — the C-ABI shim crate. See ../../PLAN.md §4.
# Depends ONLY on the safe `slint-interpreter` Rust API; converts to/from plain C
# types at the boundary. Does not touch Slint's internal (non-stable) FFI ABI.
[package]
name = "goslint-sys"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "goslint"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Path-dep on the pinned local checkout (slint/ is at the module root).
# Renderers: femtovg (GPU, Slint's desktop default) with software as fallback.
# femtovg renders straight to the window (no softbuffer CPU buffer to mis-size,
# which the software-only path hit on Windows). Needs OpenGL at build+run time.
slint-interpreter = { path = "../../slint/internal/interpreter", default-features = false, features = [
    "compat-1-2",
    "display-diagnostics",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    # SystemTrayIcon support (1.17). On Linux/BSD this pulls in ksni (StatusNotifier);
    # without it the tray element compiles but silently never registers an icon.
    "system-tray",
    # exposes properties_and_callbacks() (rich langtype::Type) for `goslint generate`
    "internal",
] }
# Headless platform for tests (init_no_event_loop / mock time). The `internal`
# feature exposes configure_test_fonts (embedded NotoSans for deterministic text).
i-slint-backend-testing = { path = "../../slint/internal/backends/testing", features = ["internal"] }
# Direct dep so we can name Model / ModelRc / ModelNotify (not re-exported by the
# interpreter). Same path as the interpreter's dep, so Cargo unifies the crate.
# "tr" enables runtime translation of @tr via an external translator we set from Go.
# "svg" makes Image::load_from_svg_data available (goslint_image_load_from_svg_data):
# it's enabled transitively by the femtovg renderer today, but pin it so it can't
# silently drop out if Slint reshuffles its renderer feature graph.
i-slint-core = { path = "../../slint/internal/core", features = ["default", "tr", "svg"] }
# The same translation crate i-slint-core uses, so we can implement tr::Translator.
tr = { version = "0.1", default-features = false }
spin_on = "0.1"
# For `goslint generate` introspection only: read the rich langtype::Type exposed
# by the interpreter's properties_and_callbacks() to emit a typed-codegen JSON.
# This is the one place we touch the compiler's (less-stable) internal types — it's
# isolated to introspect.rs and only affects `goslint generate`, not the runtime.
i-slint-compiler = { path = "../../slint/internal/compiler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Android: Slint's NativeActivity backend (pulls skia). Only compiled for android,
# so desktop builds are unaffected. android_main lives in src/android.rs.
[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-android-activity = { path = "../../slint/internal/backends/android-activity", features = ["native-activity", "aa-06"] }
# The backend selector references i_slint_backend_android_activity unconditionally
# on android (via `cfg!`, which compiles the reference regardless of the flag), so
# its `backend-android-activity` feature must be enabled or it fails to compile.
# The interpreter only forwards backend-winit, so enable it on the selector
# directly; Cargo unifies this with the selector the interpreter already pulls in.
i-slint-backend-selector = { path = "../../slint/internal/backends/selector", features = ["backend-android-activity"] }

# Fat LTO does whole-program cross-crate dead-code elimination: it shrinks the shipped
# static lib ~63% (≈153MB→56MB) and a stripped user binary ~58% (62MB→26MB). Cost is
# ~2.4x build time, and the LTO step is mostly single-threaded so it's slower still on
# low-core CI runners (acceptable: the desktop release build is only ~6 min). opt-level
# stays at the release default (3), so there's no runtime cost. Thin LTO is the lighter
# alternative (≈free build time, but only ~37% lib / ~30% binary). panic stays "unwind"
# — the FFI shim relies on catch_unwind (panic=abort would break the guards).
[profile.release]
lto = "fat"
