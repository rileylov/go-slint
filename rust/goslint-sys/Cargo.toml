# Layer 0 — the C-ABI shim crate. See ../../PLAN.md §4.
# Depends ONLY on the safe `slint-interpreter` Rust API; converts to/from plain C
# types at the boundary. Does not touch Slint's internal (non-stable) FFI ABI.
[package]
name = "goslint-sys"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "goslint"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Path-dep on the pinned local checkout (slint/ is at the module root).
# Renderers: femtovg (GPU, Slint's desktop default) with software as fallback.
# femtovg renders straight to the window (no softbuffer CPU buffer to mis-size,
# which the software-only path hit on Windows). Needs OpenGL at build+run time.
slint-interpreter = { path = "../../slint/internal/interpreter", default-features = false, features = [
    "compat-1-2",
    "display-diagnostics",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
] }
# Headless platform for tests (init_no_event_loop / mock time). The `internal`
# feature exposes configure_test_fonts (embedded NotoSans for deterministic text).
i-slint-backend-testing = { path = "../../slint/internal/backends/testing", features = ["internal"] }
# Direct dep so we can name Model / ModelRc / ModelNotify (not re-exported by the
# interpreter). Same path as the interpreter's dep, so Cargo unifies the crate.
i-slint-core = { path = "../../slint/internal/core", features = ["default"] }
spin_on = "0.1"
